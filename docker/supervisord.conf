[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; Virtual X display the login browser runs on.
[program:xvfb]
command=Xvfb :99 -screen 0 1400x1000x24 -nolisten tcp
autorestart=true
priority=10

; Minimal window manager so the browser window is usable over VNC.
[program:fluxbox]
command=fluxbox
environment=DISPLAY=":99"
autorestart=true
priority=20

; VNC server exposing the virtual display.
[program:x11vnc]
command=x11vnc -display :99 -forever -shared -nopw -rfbport 5900 -quiet
autorestart=true
priority=30

; noVNC web client on http://localhost:6080/vnc.html
[program:novnc]
command=websockify --web=/usr/share/novnc 6080 localhost:5900
autorestart=true
priority=40
